<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogFold: like</title>
<link rel="stylesheet" href="gen/like.css">
<style>
  /* Every appearance decision lives here. Rust sends one number, and it
     arrives as one CSS variable. */
  html { color-scheme: light; background: #fff; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 1rem; color: #222; }
  button { font: inherit; padding: .5rem 1rem; }
  h2 { font-size: 1rem; margin: 1.25rem 0 .25rem; color: #555; }

  /* Why mutate the HTML if we can just update CSS? The state is one
     variable, --like-liked, which the shim sets in a stylesheet rule of
     its own. A like mutates nothing in this document: not a class, not an
     attribute, not a node. Every rule below reads the variable. */
  .like { font-size: 2rem; padding: .5rem 1.5rem; color: #222; background: #fff; border: 2px solid currentColor; border-radius: 8px;
          scale: calc(1 + var(--like-liked) * .1); transition: scale .15s, color .15s; }
  .like::before { content: "♡ "; }

  /* if() reads the variable right in the declaration and, measured, costs
     the same as a class selector. Chromium only, as of September 2026. */
  @supports (color: if(style(--x: 1): red; else: blue)) {
    .like { color: if(style(--like-liked: 1): #d32f2f; else: #222); }
    .like::before { content: if(style(--like-liked: 1): "♥ "; else: "♡ "); }
  }
  /* everyone else: a style query on the same variable, Baseline 2026 */
  @supports not (color: if(style(--x: 1): red; else: blue)) {
    @container style(--like-liked: 1) {
      .like { color: #d32f2f; }
      .like::before { content: "♥ "; }
    }
  }
</style>

<p><button class="like" data-fold="like" data-on="click:toggle">like</button></p>

<h2>History</h2>
<div id="history"></div>

<script type="module">
  import init, { LikeApp } from "./pkg/like-app/like_app.js";
  import { mount } from "./logfold.mjs";
  import { timeline } from "./timeline.mjs";
  await init();
  const host = mount(new LikeApp());
  timeline(host, document.getElementById("history"));
</script>
